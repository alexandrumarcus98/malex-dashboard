services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      APP_URL: ${BESZEL_APP_URL:-https://metrics.malex.tech}
    volumes:
      - ./data/beszel:/beszel_data
    networks:
      - dashboard-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - dashboard-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-dashboard.malex.tech}
    volumes:
      - ./homepage/config:/app/config
    networks:
      - dashboard-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - homepage
      - uptime-kuma
      - beszel
    networks:
      - dashboard-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dashboard-net:
    name: dashboard-net
    driver: bridge

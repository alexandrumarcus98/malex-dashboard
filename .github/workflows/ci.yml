name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".github/**/*.md", ".agents/**/*.md"]
  pull_request:
    paths-ignore: ["README.md", "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".github/**/*.md", ".agents/**/*.md"]

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-edge-ops-dashboard
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Materialize wrangler.jsonc from secret
        env:
          WRANGLER_CONFIG_B64: ${{ secrets.WRANGLER_CONFIG_B64 }}
        run: |
          if [ -n "$WRANGLER_CONFIG_B64" ]; then
            echo "$WRANGLER_CONFIG_B64" | base64 -d > wrangler.jsonc
          else
            echo "Missing WRANGLER_CONFIG_B64 secret; skipping deploy config" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:remote
      - run: pnpm deploy

